---
layout: base
---

<div class="wrap page">
  <header class="page-head">
    <h1 class="page-title fade">{{ page.title | strip_html }}</h1>
    {%- if page.subtitle %}
    <p class="page-sub fade" style="--i:1">{{ page.subtitle | strip_html }}</p>
    {%- endif %}
  </header>

  {{ content }}

  <div class="fade" style="--i:2">
    {% include post-list.html %}
  </div>
</div>
